# Passerelle API : seule frontière de confiance pour l'IP cliente
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Pas de variables <SERVICE>_PORT=tcp://... injectées : AUTH_PORT et PAYMENT_PORT sont lus par le code
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: epsi-pay-api
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: epsi-pay-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: epsi-pay-secrets, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: epsi-pay-secrets, key: POSTGRES_DB }
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?schema=public
            - name: NODE_ENV
              value: production
            # Proxys devant la passerelle : relais local (k8s/edge, équivalent d'un Ingress) + nginx du front
            - name: TRUST_PROXY
              value: "2"
            - name: AUTH_SERVICE_URL
              value: http://auth:3001
            - name: PAYMENT_SERVICE_URL
              value: http://payment:3002
            - name: UPSTREAM_TIMEOUT_MS
              value: "5000"
          # /health interroge la base : il retire le pod du trafic si PostgreSQL tombe (readiness),
          # sans le redémarrer (liveness sur le port seul, sinon une panne BDD relancerait tous les pods)
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
